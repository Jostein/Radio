# Interactive Windows testing for the tray app.
#
# GitHub Actions already proves the Windows build and the shared core tests, but
# its runner has no interactive desktop, so the tray, its menu and the media
# flyout are never exercised there. AppVeyor's free open-source plan runs a full
# Windows VM and can pause a build for Remote Desktop, which is the point of this
# file: build radio.exe, then stay alive so someone can log in and click it.
#
# Sign in to AppVeyor with GitHub, add Jostein/Radio as a project, and start a
# build. The log prints the RDP address and password for the paused worker; the
# build finishes when the "lock" file on that desktop is deleted.

version: '{build}'
image: Visual Studio 2022

install:
  - ps: |
      if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
        Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
        # rustup writes progress to stderr; PowerShell turns that into a native
        # command error when run directly, which aborts the build before the
        # build script. Start-Process only reports the exit code.
        $p = Start-Process .\rustup-init.exe -ArgumentList @('-y', '--default-toolchain', 'stable', '--profile', 'minimal') -Wait -PassThru -NoNewWindow
        if ($p.ExitCode -ne 0) { throw "rustup-init failed: $($p.ExitCode)" }
      }
  - set PATH=%USERPROFILE%\.cargo\bin;%PATH%
  - cargo -V
  - rustc -V

build_script:
  - cd Platforms
  - cargo build --release --locked -p radio
  - cargo test --release --locked -p radio-core
  - ps: |
      $exe = Get-Item target\release\radio.exe
      "{0:N1} MB  radio.exe" -f ($exe.Length / 1MB)

  # Playback needs ffmpeg beside radio.exe (the release zip ships one; a fresh
  # worker has none, which is why the panel said ffmpeg was required). Grab the
  # essentials build and keep only the binary the app looks for.
  - ps: |
      $ErrorActionPreference = 'Stop'
      $zip = Join-Path $env:TEMP 'ffmpeg.zip'
      $out = Join-Path $env:TEMP 'ffmpeg'
      Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile $zip
      Expand-Archive $zip -DestinationPath $out -Force
      $ffmpeg = Get-ChildItem $out -Recurse -Filter ffmpeg.exe | Select-Object -First 1
      Copy-Item $ffmpeg.FullName .\target\release\ffmpeg.exe
      "{0:N1} MB  ffmpeg.exe" -f ((Get-Item .\target\release\ffmpeg.exe).Length / 1MB)


# Keep the worker alive after the build so it can be driven over RDP. The helper
# prints the connection details and waits for the lock file to be removed.
on_finish:
  # A fresh worker boots with the audio services stopped and no default endpoint,
  # and the app exits before drawing its tray when there is no output device, so
  # the desktop looks like a build that never produced an icon. Start them, and
  # show the outcome: "no sound" in the session is usually this step not having
  # run, and silence here is how that went unnoticed.
  - ps: |
      $ErrorActionPreference = 'Continue'
      foreach ($name in @('AudioEndpointBuilder', 'Audiosrv')) {
        Set-Service $name -StartupType Automatic
        Start-Service $name
      }
      Get-Service AudioEndpointBuilder, Audiosrv |
        Format-Table Name, Status, StartType -AutoSize | Out-String | Write-Host

      try { $endpoints = @(Get-PnpDevice -Class AudioEndpoint -ErrorAction Stop) }
      catch { $endpoints = @() }
      if ($endpoints.Count -eq 0) {
        Write-Warning 'No audio endpoints. In the RDP client set Play sound to "On this computer" (mstsc: Local Resources > Remote audio) and reconnect.'
      } else {
        $endpoints | Format-Table FriendlyName, Status -AutoSize | Out-String | Write-Host
      }
  - ps: $blockRdp = $true; iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))
