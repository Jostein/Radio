name: Android

on:
  push:
    branches: [main]
    paths:
      - "Mobile/Android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Mobile/Android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile/Android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "sdk.dir=$sdk_root" > local.properties

          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Report the APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
