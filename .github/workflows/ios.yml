name: iOS

on:
  push:
    branches: [main]
    paths:
      - "Mobile/iOS/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "Mobile/iOS/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Mobile/iOS/Radio.xcodeproj \
            -scheme Radio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
