name: Windows

# The port ships a single binary per platform, and Windows is the one that has
# never been run. This keeps it compiling and passing its unit tests on a real
# Windows toolchain (MSVC) so a break shows up here instead of on a desktop.
#
# It cannot prove the tray icon, the media flyout or the media keys: a runner has
# no interactive user session, so there is no notification area and no SMTC to
# attach to. That needs a machine someone is sitting at.

on:
  push:
    branches: [main]
    paths:
      - "Platforms/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "Platforms/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Platforms
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Platforms -> target"

      - name: Build the tray app
        run: cargo build --release --locked -p radio

      - name: Test the shared core
        run: cargo test --release --locked -p radio-core

      - name: Report the binary
        run: |
          $exe = Get-Item target\release\radio.exe
          "{0:N1} MB  radio.exe" -f ($exe.Length / 1MB)
